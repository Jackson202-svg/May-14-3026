<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Countdown to May 14, 2026</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
    <h1>⏳ Countdown to May 14, 2026</h1>

    <div class="countdown">
        <div class="box"><div id="months" class="number">0</div><div class="label">Months</div></div>
        <div class="box"><div id="weeks" class="number">0</div><div class="label">Weeks</div></div>
        <div class="box"><div id="days" class="number">0</div><div class="label">Days</div></div>
        <div class="box"><div id="hours" class="number">0</div><div class="label">Hours</div></div>
        <div class="box"><div id="minutes" class="number">0</div><div class="label">Minutes</div></div>
        <div class="box"><div id="seconds" class="number">0</div><div class="label">Seconds</div></div>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
